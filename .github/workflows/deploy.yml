# Deploy des Portfolios auf enver-shala.de (All-Inkl, Apache-Shared-Hosting)
#
# Ablauf bei jedem Push auf main (oder manuell über "Run workflow"):
#   1. check  – der statische SEO-Inhalt in Portfolio.dc.html muss aktuell sein
#               und dist/index.html 1:1 Portfolio.dc.html entsprechen
#               (node tools/build.mjs --check), sonst würde eine veraltete
#               Seite ausgeliefert.
#   2. deploy – lädt dist/ per FTPS (FTP mit TLS) hoch. Übertragen werden nur
#               Dateien, die sich seit dem letzten Deploy geändert haben
#               (Sync-Datei .ftp-deploy-sync-state.json auf dem Server).
#
# Benötigte Einstellungen (GitHub → Settings → Secrets and variables → Actions):
#   Secrets:   FTP_SERVER    z. B. w020189a.kasserver.com
#              FTP_USERNAME  eigener FTP-Benutzer aus dem KAS, beschränkt auf den
#                            Document-Root der Domain
#              FTP_PASSWORD
#   Variable:  FTP_SERVER_DIR  (optional) Zielordner relativ zum FTP-Benutzer,
#                              Standard "./"
#
# Solange die Secrets fehlen, wird der Deploy-Schritt übersprungen. Ein Push ist
# dann harmlos.

name: Deploy Portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-portfolio
  cancel-in-progress: false

jobs:
  check:
    name: dist/ ist aktuell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Statischer Inhalt + dist/index.html aktuell
        run: node tools/build.mjs --check

  deploy:
    name: Upload per FTPS
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://enver-shala.de
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v5

      - name: Secrets fehlen – Deploy übersprungen
        if: env.FTP_SERVER == ''
        run: echo "::warning::FTP-Secrets sind nicht gesetzt, es wurde nichts hochgeladen."

      - name: dist/ hochladen
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          exclude: |
            **/.git*
            **/.git*/**
            .image-slots.state.json
